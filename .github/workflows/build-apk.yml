name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Bara ett bygge åt gången, så att två byggen inte publicerar samtidigt
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Med en fast signeringsnyckel kan varje ny APK installeras ovanpå den förra.
      # Nyckeln läggs in som hemligheter i repot: Settings > Secrets and variables > Actions.
      - name: Lägg in signeringsnyckel
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p nycklar
            printf '%s' "$KEYSTORE_B64" | base64 -d > nycklar/sign-release.p12
            {
              echo "storeFile=nycklar/sign-release.p12"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=sncsign"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "SIGNED=ja" >> "$GITHUB_ENV"
          else
            echo "::warning::Ingen signeringsnyckel i repots hemligheter. Bygger testversion som måste avinstalleras före varje uppdatering."
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "SIGNED=nej" >> "$GITHUB_ENV"
          fi

      - name: Bygg APK
        run: gradle --no-daemon "$TASK"

      - name: Döp om APK (Sign.apk och Sign-<version>.apk)
        env:
          RUN: ${{ github.run_number }}
        run: |
          VER="$(tr -d '[:space:]' < version.txt).$RUN"
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp "$APK" Sign.apk
          cp "$APK" "Sign-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Sign-${{ env.VER }}
          path: |
            Sign.apk
            Sign-${{ env.VER }}.apk

      - name: Publicera som nedladdning
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          NOTES=$(printf 'Version: %s\nBuild: %s\nSignerad med fast nyckel: %s\n\nÖppna den här sidan på telefonen, ladda ner Sign.apk och installera.\nByggd från %s.' "$VER" "$RUN" "$SIGNED" "${GITHUB_SHA::7}")

          # 1. En egen utgåva per version (v1.2.10) som sparas, med en git-tagg på exakt den koden.
          #    Används vid felsökning eller för att göra en gren: git switch -c fix v$VER
          OLD=$(printf 'Äldre version, sparad för felsökning.\n\nVersion: %s\nByggd från %s.\nGör en gren från den här versionen: git switch -c fix v%s' "$VER" "${GITHUB_SHA::7}" "$VER")
          gh release create "v$VER" "Sign-$VER.apk" --target "$GITHUB_SHA" --title "Sign $VER" --notes "$OLD" --latest=false || \
            gh release upload "v$VER" "Sign-$VER.apk" --clobber

          # 2. "senaste": Sign.apk (fast länk, används av appens uppdatering) och aktuell Sign-<version>.apk.
          #    Filerna byts ut på plats, så att länken aldrig försvinner.
          git tag -f senaste "$GITHUB_SHA"
          git push -f origin refs/tags/senaste
          if gh release view senaste >/dev/null 2>&1; then
            gh release upload senaste Sign.apk "Sign-$VER.apk" --clobber
            for a in $(gh release view senaste --json assets --jq '.assets[].name'); do
              case "$a" in Sign-*.apk) [ "$a" != "Sign-$VER.apk" ] && gh release delete-asset senaste "$a" --yes || true ;; esac
            done
            gh release edit senaste --title "Sign $VER" --notes "$NOTES" --prerelease=false --latest
          else
            gh release create senaste Sign.apk "Sign-$VER.apk" --latest --title "Sign $VER" --notes "$NOTES"
          fi
