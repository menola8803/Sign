name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Med en fast signeringsnyckel kan varje ny APK installeras ovanpå den förra.
      # Nyckeln läggs in som hemligheter i repot: Settings > Secrets and variables > Actions.
      - name: Lägg in signeringsnyckel
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p nycklar
            printf '%s' "$KEYSTORE_B64" | base64 -d > nycklar/sign-release.p12
            {
              echo "storeFile=nycklar/sign-release.p12"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=sncsign"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "SIGNED=ja" >> "$GITHUB_ENV"
          else
            echo "::warning::Ingen signeringsnyckel i repots hemligheter. Bygger testversion som måste avinstalleras före varje uppdatering."
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "SIGNED=nej" >> "$GITHUB_ENV"
          fi

      - name: Bygg APK
        run: gradle --no-daemon "$TASK"

      - name: Döp om APK
        run: cp "$APK" Sign.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sign-apk
          path: Sign.apk

      - name: Publicera som nedladdning
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          VER="$(tr -d '[:space:]' < version.txt).$RUN"
          NOTES=$(printf 'Version: %s\nBuild: %s\nSignerad med fast nyckel: %s\n\nÖppna den här sidan på telefonen, ladda ner Sign.apk och installera.\nByggd från %s.' "$VER" "$RUN" "$SIGNED" "${GITHUB_SHA::7}")
          gh release delete senaste --yes --cleanup-tag || true
          gh release create senaste Sign.apk \
            --prerelease \
            --title "Sign $VER" \
            --notes "$NOTES"
